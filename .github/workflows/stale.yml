name: Stale

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issues: only follow up on issues waiting for the reporter (needs-info).
          # Inactivity alone does not mean an issue is resolved, so other issues are triaged by maintainers.
          only-issue-labels: "needs-info"
          days-before-issue-stale: 14
          days-before-issue-close: 7
          stale-issue-label: "stale"
          stale-issue-message: |
            这个 issue 在等待补充信息，已经 14 天没有更新。如果 7 天内仍没有回复，会自动关闭；补充信息后会继续处理。

            This issue has been waiting for more information for 14 days. It will be closed automatically in 7 days without an update; once the information is added, we'll pick it up again.
          close-issue-message: |
            由于一直没有收到补充信息，这个 issue 已自动关闭。补充信息后可以直接回复或重新打开。

            This issue was closed because the requested information wasn't provided. Feel free to reply or reopen it once you have the details.

          # Pull Requests
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: "stale"
          stale-pr-message: |
            This pull request has been inactive for 30 days. It will be automatically closed in 14 days unless there is new activity.

            If you're still working on this, please leave a comment or push new commits to keep it open. Thank you!
          close-pr-message: |
            This pull request was automatically closed due to inactivity. Feel free to reopen it if you'd like to continue.

          # Exempt labels
          exempt-issue-labels: "pinned,security,bug,enhancement"
          exempt-pr-labels: "pinned,security,work-in-progress,wip"

          # Only label, don't close draft PRs
          exempt-draft-pr: true

          operations-per-run: 100
