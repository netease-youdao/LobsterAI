name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ========== Stage 1: 变更检测 ==========
  changed-files:
    runs-on: ubuntu-latest
    outputs:
      renderer: ${{ steps.changes.outputs.renderer }}
      main: ${{ steps.changes.outputs.main }}
      skills: ${{ steps.changes.outputs.skills }}
      scripts: ${{ steps.changes.outputs.scripts }}
      tests: ${{ steps.changes.outputs.tests }}
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            renderer:
              # Preserve the former Electron Verify workflow's source coverage.
              - 'src/**'
              - 'vite.config.ts'
              - 'vite.thumbnail.config.ts'
              - 'tsconfig.json'
              - 'tailwind.config.js'
              - 'postcss.config.js'
              - 'electron-builder.json'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - '.github/workflows/ci.yml'
              - '.github/workflows/electron-verify.yml'
            main:
              - 'src/main/**'
              - 'src/common/**'
              - 'src/shared/**'
              - 'electron-tsconfig.json'
              - 'src/main/preload.ts'
              - 'scripts/*openclaw*'
              - 'scripts/patches/**'
            skills:
              - 'SKILLs/**'
            scripts:
              - 'scripts/**'
              - 'electron-builder.json'
            tests:
              - 'src/**/*.test.ts'
              - 'tests/**'
              - 'vitest.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - '**/*.md'

  # ========== Stage 2: 代码质量 (快速) ==========
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find changed TypeScript files
        id: lint-files
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          FILE_LIST="$RUNNER_TEMP/eslint-changed-files"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only -z --diff-filter=ACMR "origin/${BASE_REF}...HEAD" -- '*.ts' '*.tsx' > "$FILE_LIST"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only -z --diff-filter=ACMR "${BEFORE_SHA}...HEAD" -- '*.ts' '*.tsx' > "$FILE_LIST"
          else
            echo "BEFORE_SHA unavailable, falling back to HEAD~1"
            git diff --name-only -z --diff-filter=ACMR HEAD~1 -- '*.ts' '*.tsx' > "$FILE_LIST"
          fi
          if [ -s "$FILE_LIST" ]; then
            echo "has_typescript=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_typescript=false" >> "$GITHUB_OUTPUT"
            echo "No TypeScript files changed, skipping lint"
          fi
      - uses: actions/setup-node@v4
        if: steps.lint-files.outputs.has_typescript == 'true'
        with:
          node-version: '24.x'
      - uses: actions/cache@v4
        if: steps.lint-files.outputs.has_typescript == 'true'
        with:
          path: ${{ runner.temp }}/lobsterai-npm-cache/_cacache
          key: npm-downloads-v2-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json', '.npmrc') }}
      - run: npm ci --cache "$RUNNER_TEMP/lobsterai-npm-cache" --prefer-offline --no-audit --fund=false
        if: steps.lint-files.outputs.has_typescript == 'true'
      - name: Lint changed files only
        if: steps.lint-files.outputs.has_typescript == 'true'
        run: |
          echo "Linting changed files:"
          tr '\0' '\n' < "$RUNNER_TEMP/eslint-changed-files"
          # Keep filenames NUL-delimited and skip eslint-ignored paths silently.
          xargs -0 npx eslint --ext ts,tsx --report-unused-disable-directives --max-warnings 0 --no-warn-ignored -- < "$RUNNER_TEMP/eslint-changed-files"

  # Build and verify the renderer and Electron bundles once, alongside lint/tests.
  build-renderer:
    needs: changed-files
    if: ${{ needs.changed-files.outputs.renderer == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lobsterai-npm-cache/_cacache
          key: npm-downloads-v2-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json', '.npmrc') }}
      - run: npm ci --cache "$RUNNER_TEMP/lobsterai-npm-cache" --prefer-offline --no-audit --fund=false
      - run: npm run build
      - name: Verify Build Structure
        run: |
          for file in dist/index.html dist-electron/main.js dist-electron/preload.js; do
            if [ ! -f "$file" ]; then
              echo "Missing build output: $file"
              exit 1
            fi
          done
          echo "Renderer and Electron build outputs verified"
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-dist
          path: dist/
          retention-days: 1

  # ========== Stage 4: Main 进程构建 ==========
  build-main:
    needs: changed-files
    if: ${{ needs.changed-files.outputs.main == 'true' || needs.changed-files.outputs.renderer == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lobsterai-npm-cache/_cacache
          key: npm-downloads-v2-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json', '.npmrc') }}
      - run: npm ci --cache "$RUNNER_TEMP/lobsterai-npm-cache" --prefer-offline --no-audit --fund=false
      - run: npm run compile:electron
      - uses: actions/upload-artifact@v4
        with:
          name: main-dist
          path: dist-electron/
          retention-days: 1

  # ========== Stage 5: Skill 构建 ==========
  build-skills:
    needs: changed-files
    if: ${{ needs.changed-files.outputs.skills == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lobsterai-npm-cache/_cacache
          key: npm-downloads-v2-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json', '.npmrc') }}
      - run: npm ci --cache "$RUNNER_TEMP/lobsterai-npm-cache" --prefer-offline --no-audit --fund=false
      - run: npm run build:skills

  # ========== Stage 6: Vitest ==========
  test:
    needs: changed-files
    # Vitest uses this job's checkout; it does not consume build-main artifacts.
    if: >-
      ${{ github.event_name == 'push'
              || needs.changed-files.outputs.main == 'true'
              || needs.changed-files.outputs.renderer == 'true'
              || needs.changed-files.outputs.skills == 'true'
              || needs.changed-files.outputs.scripts == 'true'
              || needs.changed-files.outputs.tests == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lobsterai-npm-cache/_cacache
          key: npm-downloads-v2-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json', '.npmrc') }}
      - run: npm ci --cache "$RUNNER_TEMP/lobsterai-npm-cache" --prefer-offline --no-audit --fund=false
      - run: npm test

  # Preserve the verify check while reporting failures from every parallel check.
  verify:
    needs: [changed-files, lint, build-renderer, build-main, build-skills, test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify check results
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const JobResult = { Success: 'success', Skipped: 'skipped' };
          const requiredJobs = new Set(['changed-files', 'lint']);
          const failures = Object.entries(JSON.parse(process.env.CHECK_RESULTS))
            .filter(([name, job]) => job.result !== JobResult.Success
              && (requiredJobs.has(name) || job.result !== JobResult.Skipped));
          if (failures.length > 0) {
            console.error('CI checks did not pass:', failures.map(([name, job]) => `${name}: ${job.result}`).join(', '));
            process.exit(1);
          }
          console.log('All required CI checks passed');
          NODE
