name: OpenClaw Integration Check

on:
  push:
    paths:
      - 'package.json'
      - 'scripts/ensure-openclaw-version.cjs'
      - 'scripts/**openclaw*'
  pull_request:
    paths:
      - 'package.json'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-openclaw-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      
      - name: Check Runtime Version Format
        run: |
          node -e "
            const pkg = require('./package.json');
            if (pkg.dsh) {
              const version = pkg.dsh.version;
              if (typeof version !== 'string' || !/^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$/.test(version)) {
                console.error('❌ Invalid DSH version format:', version);
                process.exit(1);
              }
              if (pkg.dsh.npm !== '@deepseek-ai/dsh') {
                console.error('❌ Invalid DSH npm package:', pkg.dsh.npm);
                process.exit(1);
              }
              if (typeof pkg.dsh.pnpm !== 'string' || !/^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$/.test(pkg.dsh.pnpm)) {
                console.error('❌ Invalid DSH pnpm version format:', pkg.dsh.pnpm);
                process.exit(1);
              }
              console.log('✓ DSH runtime configuration valid:', pkg.dsh.npm + '@' + version, '(pnpm ' + pkg.dsh.pnpm + ')');
              process.exit(0);
            }
            const version = pkg.openclaw && pkg.openclaw.version;
            if (typeof version !== 'string' || !/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(version)) {
              console.error('❌ Invalid OpenClaw version format:', version);
              console.error('Expected format: vX.Y.Z (e.g., v2026.3.2)');
              process.exit(1);
            }
            console.log('✓ OpenClaw version format valid:', version);
          "

      - name: Validate Runtime Package Metadata
        run: |
          node -e "
            const pkg = require('./package.json');
            if (pkg.dsh) {
              const runtimes = pkg.dsh.runtimes;
              if (!runtimes || typeof runtimes !== 'object' || Object.keys(runtimes).length === 0) {
                console.error('❌ Invalid dsh.runtimes configuration: must be a non-empty object');
                process.exit(1);
              }
              let hasError = false;
              for (const [target, meta] of Object.entries(runtimes)) {
                if (!meta || typeof meta.url !== 'string' || !/^https:\/\//.test(meta.url)) {
                  console.error('❌ Runtime ' + target + ' has invalid url');
                  hasError = true;
                }
                if (!meta || typeof meta.sha256 !== 'string' || !/^[0-9a-f]{64}$/i.test(meta.sha256)) {
                  console.error('❌ Runtime ' + target + ' has invalid sha256');
                  hasError = true;
                }
                if (!meta || typeof meta.size !== 'number' || meta.size <= 0) {
                  console.error('❌ Runtime ' + target + ' has invalid size');
                  hasError = true;
                }
              }
              if (hasError) process.exit(1);
              console.log('✓ All DSH runtime entries valid:', Object.keys(runtimes).join(', '));
              process.exit(0);
            }
            const repo = pkg.openclaw && pkg.openclaw.repo;
            if (typeof repo !== 'string' || !/^https:\/\/github\.com\/.+\/.+\.git$/.test(repo)) {
              console.error('❌ Invalid OpenClaw repository URL:', repo);
              process.exit(1);
            }
            if (!pkg.openclaw.plugins || !Array.isArray(pkg.openclaw.plugins)) {
              console.error('❌ Invalid openclaw.plugins configuration: must be an array');
              process.exit(1);
            }
            let hasError = false;
            pkg.openclaw.plugins.forEach((plugin, index) => {
              if (!plugin.id) {
                console.error('❌ Plugin at index ' + index + ' missing \"id\" field');
                hasError = true;
              }
              if (!plugin.npm) {
                console.error('❌ Plugin at index ' + index + ' missing \"npm\" field');
                hasError = true;
              }
              if (!plugin.version) {
                console.error('❌ Plugin at index ' + index + ' missing \"version\" field');
                hasError = true;
              }
            });
            if (hasError) process.exit(1);
            console.log('✓ OpenClaw repository and plugins valid');
          "

      - name: Check Runtime Scripts Exist
        run: |
          if node -e "process.exit(require('./package.json').dsh ? 0 : 1)"; then
            SCRIPTS=(
              "scripts/build-dsh-runtime.cjs"
              "scripts/dsh-upgrade-check.cjs"
              "scripts/unpack-dsh-resources.cjs"
            )
          else
            SCRIPTS=(
              "scripts/ensure-openclaw-version.cjs"
              "scripts/apply-openclaw-patches.cjs"
              "scripts/bundle-openclaw-gateway.cjs"
              "scripts/ensure-openclaw-plugins.cjs"
              "scripts/sync-local-openclaw-extensions.cjs"
              "scripts/precompile-openclaw-extensions.cjs"
              "scripts/prune-openclaw-runtime.cjs"
              "scripts/run-build-openclaw-runtime.cjs"
              "scripts/sync-openclaw-runtime-current.cjs"
            )
          fi

          MISSING=0
          for script in "${SCRIPTS[@]}"; do
            if [ -f "$script" ]; then
              echo "✓ $script"
            else
              echo "⚠ $script not found"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ $MISSING -gt 0 ]; then
            echo "⚠ $MISSING runtime scripts missing"
          fi
