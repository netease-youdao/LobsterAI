<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LobsterAI</title>
    <style>
      /* Pre-React app-shell skeleton matching the real sidebar + main canvas
         so the window renders immediately with zero splash flash. Replaced
         automatically when React mounts into #root. */
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      .boot-shell,
      .boot-shell * {
        box-sizing: border-box;
      }
      .boot-shell {
        position: fixed;
        inset: 0;
        display: flex;
        background: #ffffff;
      }
      html.dark .boot-shell {
        background: #0f1117;
      }
      .boot-shell-sidebar {
        width: 260px;
        flex-shrink: 0;
        background: #f5f5f5;
      }
      html.dark .boot-shell-sidebar {
        background: #242830;
      }
      .boot-shell-main {
        flex: 1;
        min-width: 0;
        background: #ffffff;
      }
      html.dark .boot-shell-main {
        background: #0f1117;
      }
    </style>
    <script>
      // 在页面加载前预设主题，避免闪烁。
      // 'lobster-theme-appearance' 由 theme-manager.ts 在每次应用主题时写入。
      (function () {
        try {
          var appearance = localStorage.getItem('lobster-theme-appearance');
          if (appearance !== 'dark' && appearance !== 'light') {
            appearance = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.add(appearance);
          document.documentElement.style.backgroundColor = appearance === 'dark' ? '#0F1117' : '#FFFFFF';
        } catch (e) {
          console.error('Error applying theme early:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell" aria-hidden="true">
        <div class="boot-shell-sidebar"></div>
        <div class="boot-shell-main"></div>
      </div>
    </div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
